name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Escopo compartilhado pelos passos de story->develop/main (changelog, SonarCloud) - ver docs/CI-CD.md
      - name: Calcular escopo de story->develop/main
        id: story-gate
        run: |
          if [ "${{ github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main' }}" = "true" ]; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
          else
            echo "applies=false" >> "$GITHUB_OUTPUT"
          fi

      # 1. Changelog - so no PR pra develop/main, ver docs/CI-CD.md
      - name: Validar atualizacao do CHANGELOG.md
        if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/validate-changelog.sh CHANGELOG.md

      # 2. i18n - guarda propria, ver docs/CI-CD.md
      - name: Validar chaves de traducao (pt-BR/en-US/es)
        if: hashFiles('src/main/resources/messages_pt_BR.properties') != ''
        run: |
          python3 .github/scripts/validate-i18n-keys.py --format properties \
            --file pt-BR=src/main/resources/messages_pt_BR.properties \
            --file en-US=src/main/resources/messages_en_US.properties \
            --file es=src/main/resources/messages_es.properties

      # Guarda por arquivo-marcador (pom.xml) - ver docs/CI-CD.md
      - uses: actions/setup-java@v4
        if: hashFiles('pom.xml') != ''
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # 3. Build
      - name: Build
        if: hashFiles('pom.xml') != ''
        run: mvn -B -DskipTests package

      # 4. Testes unitarios + cobertura
      - name: Testes unitarios e cobertura
        if: hashFiles('pom.xml') != ''
        run: mvn -B verify

      # 5. SonarCloud - pulado em PR de subtask, ver docs/CI-CD.md. qualitygate.wait pulado em
      # qualquer push direto (nao so develop - achado real feat-014, 2026-09-10: a primeira
      # analise de uma branch longa nova, main incluso, nao tem leak period definido, API
      # devolve status "NONE" em vez de "OK"/"ERROR" e o plugin trata isso como reprovado; o
      # ponto de bloqueio real sempre foi a PR, nao o push)
      - name: SonarCloud
        if: hashFiles('pom.xml') != '' && steps.story-gate.outputs.applies == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          WAIT_FLAG="-Dsonar.qualitygate.wait=true"
          if [ "${{ github.event_name == 'push' }}" = "true" ]; then
            WAIT_FLAG=""
          fi
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey=eimmig_sv-stats-backend \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            $WAIT_FLAG

      # 6. Gate de issue/hotspot do SonarCloud - pulado em qualquer push direto (mesmo racional do passo 5)
      - name: Validar zero issues no SonarCloud
        if: hashFiles('pom.xml') != '' && steps.story-gate.outputs.applies == 'true' && github.event_name != 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          python3 .github/scripts/validate-sonar-issues.py
          --project-key eimmig_sv-stats-backend
          ${{ github.event_name == 'pull_request' && format('--pull-request {0}', github.event.pull_request.number) || format('--branch {0}', github.ref_name) }}

  build-and-push-image:
    needs: pipeline
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/eimmig/sv-stats-backend:${{ github.sha }}
            ghcr.io/eimmig/sv-stats-backend:latest

  deploy:
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # kubectl ja vem preinstalado no runner ubuntu-latest - sem action de terceiro
      - name: Configurar kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"

      - name: Reiniciar deployment
        run: kubectl rollout restart deployment/stats-service

  release:
    needs: pipeline
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Calcula a proxima versao a partir de Conventional Commits desde a ultima tag - so
      # calcula, nao cria a tag (isso e o passo "Criar tag e GitHub Release" mais abaixo).
      # github.token de leitura basta aqui, nada disto e bloqueado por branch protection.
      - name: Calcular proxima versao (Conventional Commits)
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: main
          noVersionBumpBehavior: patch

      - name: Atualizar versao no pom.xml
        run: mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion=${{ steps.semver.outputs.nextStrict }} -DgenerateBackupPoms=false

      - name: Validar XML do pom.xml apos o bump
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('pom.xml')"

      - name: Cortar CHANGELOG.md
        run: python3 .github/scripts/cut-changelog.py CHANGELOG.md ${{ steps.semver.outputs.nextStrict }}

      # main tem required status check "pipeline" - o GITHUB_TOKEN padrao roda como
      # github-actions[bot], que nao e admin e seria rejeitado empurrando um commit novo
      # (nenhum check rodou pra ele ainda). RELEASE_TOKEN (PAT do dono/admin, ver
      # docs/pipeline-ci-cd.md) bypassa isso do mesmo jeito que um push manual do dono
      # bypassaria - usado so aqui, embutido na URL (vida curta de um comando), nunca
      # persistido no credential helper (persist-credentials: false acima). [skip ci] evita
      # o loop: PAT (diferente de GITHUB_TOKEN) dispara o workflow de novo por padrao.
      - name: Commit e push da release
        id: release-commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEXT_VERSION: ${{ steps.semver.outputs.next }}
        run: |
          git add pom.xml CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $NEXT_VERSION [skip ci]"
            git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # commit: aponta explicitamente pro commit que acabou de ser empurrado (o bump) -
      # sem isso a action usaria o commit que disparou o job, ANTES do bump.
      - name: Criar tag e GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.semver.outputs.next }}
          name: ${{ steps.semver.outputs.next }}
          commit: ${{ steps.release-commit.outputs.sha }}
          token: ${{ github.token }}
          generateReleaseNotes: true
