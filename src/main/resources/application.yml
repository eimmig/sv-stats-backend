spring:
  application:
    name: stats-service
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  messages:
    fallback-to-system-locale: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stats}
    username: ${DB_USER:stats_user}
    password: ${DB_PASSWORD}

admin:
  api-key: ${ADMIN_API_KEY}

---
spring:
  config:
    activate:
      on-profile: test

admin:
  api-key: test-admin-api-key

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

admin:
  api-key: ${ADMIN_API_KEY}
